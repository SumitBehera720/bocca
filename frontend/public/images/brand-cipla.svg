<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="ciplaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F8FF"/>
      <stop offset="100%" stop-color="#E5F0FF"/>
    </linearGradient>
    <linearGradient id="ciplaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003875"/>
      <stop offset="100%" stop-color="#0072CE"/>
    </linearGradient>
    <filter id="ciplaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#003875" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#ciplaBg)"/>
  
  <!-- Subtle respiratory wave / pulse -->
  <path d="M 0,90 Q 80,40 160,90 T 320,90" fill="none" stroke="#0072CE" stroke-width="2" opacity="0.15"/>

  <!-- Cipla Brand Badge -->
  <g transform="translate(50, 32)">
    <rect x="0" y="0" width="220" height="78" rx="20" fill="url(#ciplaGrad)" filter="url(#ciplaShadow)"/>
    
    <!-- Medical Leaf / Care Icon -->
    <g transform="translate(24, 22)" fill="#00D2C4">
      <circle cx="15" cy="17" r="14" fill="#ffffff" opacity="0.2"/>
      <path d="M 15,6 C 9,13 8,24 15,28 C 22,24 21,13 15,6 Z" fill="#00D2C4"/>
    </g>

    <!-- Cipla Typography -->
    <text x="130" y="52" font-family="'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">Cipla</text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(160, 144)">
    <rect x="-105" y="-14" width="210" height="24" rx="12" fill="#003875" fill-opacity="0.09"/>
    <text x="0" y="2" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#003875" text-anchor="middle" letter-spacing="1.2">RESPIRATORY &amp; THERAPY</text>
  </g>
</svg>
