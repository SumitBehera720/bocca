<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="gskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F4"/>
      <stop offset="100%" stop-color="#FEEDDF"/>
    </linearGradient>
    <linearGradient id="gskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A00"/>
      <stop offset="100%" stop-color="#E03200"/>
    </linearGradient>
    <filter id="gskShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5A00" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#gskBg)"/>
  
  <!-- Subtle decorative accents -->
  <g opacity="0.08" stroke="#FF5A00" stroke-width="1.5">
    <circle cx="40" cy="90" r="50" fill="none"/>
    <circle cx="280" cy="50" r="30" fill="none"/>
    <path d="M 40,160 Q 160,110 280,160" fill="none"/>
  </g>

  <!-- Main GSK Rounded Emblem -->
  <g transform="translate(60, 32)">
    <!-- Unique GSK organic curved pill / badge -->
    <rect x="0" y="0" width="200" height="82" rx="28" fill="url(#gskGrad)" filter="url(#gskShadow)"/>
    
    <!-- Medicine cross mini icon -->
    <g transform="translate(26, 26)" fill="#ffffff">
      <rect x="10" y="2" width="6" height="26" rx="3"/>
      <rect x="0" y="12" width="26" height="6" rx="3"/>
    </g>

    <!-- GSK Text -->
    <text x="120" y="56" font-family="'Trebuchet MS', 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">gsk</text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(160, 144)">
    <rect x="-105" y="-14" width="210" height="24" rx="12" fill="#FF5A00" fill-opacity="0.1"/>
    <text x="0" y="2" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#D34200" text-anchor="middle" letter-spacing="1.2">CONSUMER HEALTHCARE</text>
  </g>
</svg>
