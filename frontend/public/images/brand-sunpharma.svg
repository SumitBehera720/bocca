<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="sunBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="100%" stop-color="#FFF4DE"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39200"/>
      <stop offset="100%" stop-color="#C85A00"/>
    </linearGradient>
    <filter id="sunShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F39200" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#sunBg)"/>
  
  <!-- Subtle sun burst rays -->
  <g opacity="0.08" stroke="#F39200" stroke-width="2">
    <circle cx="270" cy="50" r="40" fill="none"/>
    <line x1="270" y1="0" x2="270" y2="100"/>
    <line x1="220" y1="50" x2="320" y2="50"/>
  </g>

  <!-- Sun Pharma Badge -->
  <g transform="translate(35, 32)">
    <rect x="0" y="0" width="250" height="78" rx="20" fill="url(#sunGrad)" filter="url(#sunShadow)"/>
    
    <!-- Rising Sun Pharma Icon -->
    <g transform="translate(22, 21)" fill="#ffffff">
      <circle cx="18" cy="18" r="16" fill="#ffffff" opacity="0.2"/>
      <path d="M 18,10 A 8,8 0 0,1 26,18 L 10,18 A 8,8 0 0,1 18,10 Z" fill="#ffffff"/>
      <circle cx="18" cy="7" r="2" fill="#ffffff"/>
      <circle cx="26" cy="10" r="2" fill="#ffffff"/>
      <circle cx="10" cy="10" r="2" fill="#ffffff"/>
      <rect x="10" y="21" width="16" height="3" rx="1.5" fill="#ffffff"/>
    </g>

    <!-- Sun Pharma Typography -->
    <text x="140" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">SUN PHARMA</text>
    <text x="140" y="60" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0.85" text-anchor="middle" letter-spacing="2">ESSENTIAL FORMULATIONS</text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(160, 144)">
    <rect x="-105" y="-14" width="210" height="24" rx="12" fill="#F39200" fill-opacity="0.12"/>
    <text x="0" y="2" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#A84300" text-anchor="middle" letter-spacing="1.2">GLOBAL PHARMACEUTICALS</text>
  </g>
</svg>
