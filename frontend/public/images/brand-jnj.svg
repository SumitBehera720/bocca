<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="jnjBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F5"/>
      <stop offset="100%" stop-color="#FFE8E8"/>
    </linearGradient>
    <linearGradient id="jnjGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E01020"/>
      <stop offset="100%" stop-color="#A50010"/>
    </linearGradient>
    <filter id="jnjShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E01020" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#jnjBg)"/>
  
  <!-- Subtle Cross & Heart Accents -->
  <g opacity="0.08" fill="#E01020">
    <rect x="250" y="25" width="40" height="12" rx="4"/>
    <rect x="264" y="11" width="12" height="40" rx="4"/>
  </g>

  <!-- Johnson & Johnson Badge -->
  <g transform="translate(35, 32)">
    <rect x="0" y="0" width="250" height="78" rx="20" fill="url(#jnjGrad)" filter="url(#jnjShadow)"/>
    
    <!-- Red Cross Emblem -->
    <g transform="translate(20, 24)" fill="#ffffff">
      <rect x="11" y="0" width="8" height="30" rx="3"/>
      <rect x="0" y="11" width="30" height="8" rx="3"/>
    </g>

    <!-- Typography -->
    <text x="145" y="40" font-family="'Georgia', 'Times New Roman', serif" font-size="20" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle">Johnson &amp; Johnson</text>
    <text x="145" y="60" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" opacity="0.85" text-anchor="middle" letter-spacing="1.5">FAMILY HEALTHCARE</text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(160, 144)">
    <rect x="-105" y="-14" width="210" height="24" rx="12" fill="#E01020" fill-opacity="0.09"/>
    <text x="0" y="2" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#A50010" text-anchor="middle" letter-spacing="1">FIRST AID &amp; SKIN CARE</text>
  </g>
</svg>
