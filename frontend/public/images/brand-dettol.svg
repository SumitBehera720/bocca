<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="dettolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2FBF6"/>
      <stop offset="100%" stop-color="#E3F7EB"/>
    </linearGradient>
    <linearGradient id="dettolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008A43"/>
      <stop offset="100%" stop-color="#005C2B"/>
    </linearGradient>
    <filter id="dettolShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#008A43" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#dettolBg)"/>
  
  <!-- Subtle shield outline background -->
  <path d="M 270,30 L 300,45 L 300,75 C 300,100 270,120 270,120 C 270,120 240,100 240,75 L 240,45 Z" fill="none" stroke="#008A43" stroke-width="2" opacity="0.15"/>

  <!-- Dettol Emblem Badge -->
  <g transform="translate(48, 32)">
    <rect x="0" y="0" width="224" height="78" rx="20" fill="url(#dettolGrad)" filter="url(#dettolShadow)"/>
    
    <!-- Dettol Iconic Sword Icon -->
    <g transform="translate(24, 18)">
      <circle cx="18" cy="21" r="18" fill="#ffffff" opacity="0.2"/>
      <!-- Sword blade and hilt -->
      <path d="M 17,6 L 19,6 L 19,26 L 17,26 Z" fill="#ffffff"/>
      <rect x="12" y="26" width="12" height="3" rx="1.5" fill="#ffffff"/>
      <circle cx="18" cy="33" r="2.5" fill="#ffffff"/>
      <!-- Cross guard -->
      <path d="M 18,7 L 21,11 L 18,10 L 15,11 Z" fill="#ffffff"/>
    </g>

    <!-- Dettol Typography -->
    <text x="135" y="52" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">Dettol</text>
  </g>

  <!-- Subtitle Tag -->
  <g transform="translate(160, 144)">
    <rect x="-105" y="-14" width="210" height="24" rx="12" fill="#008A43" fill-opacity="0.1"/>
    <text x="0" y="2" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#005C2B" text-anchor="middle" letter-spacing="1.2">ANTISEPTIC &amp; HYGIENE</text>
  </g>
</svg>
